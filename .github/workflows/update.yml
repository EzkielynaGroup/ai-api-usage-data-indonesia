name: Update data

on:
  schedule:
    - cron: "15 1 * * *" # daily 01:15 UTC = 08:15 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test the updater (local fixtures, no network)
        run: python3 -m unittest discover -s tests -v

      - name: Fetch public data and write snapshots
        run: python3 scripts/update.py

      - name: Commit only if data changed
        run: |
          git add data latest README.md
          if git diff --cached --quiet; then
            echo "No data change, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: snapshot $(TZ=Asia/Jakarta date +%F)"
          git push
